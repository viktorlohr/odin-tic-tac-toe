<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <h1>Tic Tac Toe!</h1>
    <div class="gameboard"></div>
    <div class="current-player-announcement">
      Current Player: &nbsp; <span class="current-player"></span>
    </div>

    <div class="game-over">
      <h2>Game Over!</h2>
      <div class="winner-announcement">
        The winner is: &nbsp; <span class="winner"></span>
      </div>
      <button class="reset">Reset</button>
    </div>
  </body>
</html>
